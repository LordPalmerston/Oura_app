name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies and build web
      working-directory: frontend
      run: |
        npm install --legacy-peer-deps
        npm run build
        npx cap sync ios

    - name: Build iOS App Archive
      working-directory: frontend/ios/App
      run: |
        xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug clean build -sdk iphonesimulator -derivedDataPath build
        # Note: To build an installable .ipa for a physical device, Apple requires code signing
        # with a valid Developer Certificate and Provisioning Profile.
        # This builds the simulator .app which proves the code compiles successfully.
        
    - name: Zip Simulator App
      working-directory: frontend/ios/App/build/Build/Products/Debug-iphonesimulator
      run: zip -r App.app.zip App.app

    - name: Upload iOS Simulator Build
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: frontend/ios/App/build/Build/Products/Debug-iphonesimulator/App.app.zip
